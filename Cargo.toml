[workspace]
members = ["crates/payoff-math"]
exclude = ["archive/privacy-track", "research/g1"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
primitive-types = { version = "=0.13.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
overflow-checks = true

