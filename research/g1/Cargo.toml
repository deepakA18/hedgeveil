[workspace]
members = ["types", "contracts/core", "contracts/oracle", "contracts/receiver", "contracts/tokens"]
resolver = "2"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
