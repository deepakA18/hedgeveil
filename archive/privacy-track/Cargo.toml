[workspace]
members = ["crates/payoff-math", "crates/note-spend-spike", "contracts/verifier-spike"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
primitive-types = { version = "=0.13.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-serialize = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-relations = "=0.5.1"
ark-r1cs-std = "=0.5.0"
ark-crypto-primitives = { version = "=0.5.0", features = ["sponge", "r1cs"] }
light-poseidon = "=0.4.0"
rand = "=0.8.5"
sha2 = "=0.10.9"
hex = "=0.4.3"


[profile.release]
overflow-checks = true

